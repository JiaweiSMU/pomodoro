<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A Pomodoro timer that hatches a pixel animal every time you finish a focus session." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pomodoro</title>
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('pomodoro.settings') || '{}')
        var dark = s.theme ? s.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
